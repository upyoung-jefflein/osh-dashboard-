name: 定期更新職安法規觀測站

"on":
  schedule:
    - cron: '0 1 * * *'   # 每日 UTC 01:00 = 台灣時間 09:00
  workflow_dispatch:        # 允許手動從 GitHub 介面觸發

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整歷史，rebase 時需要

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 取得最新開發者改動
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      # GitHub runner 連不到法務部網站，法規 XML 改由本機排程（scripts/daily_update.ps1）下載並推送；
      # 這裡只更新新聞，法規沿用 repo 內的 osh_xml_records.json。
      - name: 更新新聞並重建 Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python osh_dashboard.py -o docs/index.html

      - name: 提交並推送更新
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          commit_and_push() {
            git add docs/index.html
            if git diff --staged --quiet; then
              echo "無異動，略過 commit。"
              return 0
            fi
            git commit -m "auto: 定期更新 $(date -u +%Y-%m-%d)"
            git push
          }
          if ! commit_and_push; then
            # 有人剛推（例如本機排程的法規更新）：以最新遠端重新生成，避免合併時蓋掉對方的資料
            git fetch origin
            git reset --hard origin/main
            python osh_dashboard.py -o docs/index.html
            commit_and_push
          fi
