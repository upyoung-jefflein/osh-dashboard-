name: 定期更新職安法規觀測站

"on":
  schedule:
    - cron: '0 1 * * 1'   # 每週一 UTC 01:00 = 台灣時間 09:00
  workflow_dispatch:        # 允許手動從 GitHub 介面觸發

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 下載最新法規 XML 並重建 Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python osh_dashboard.py --fetch-xml -o docs/index.html

      - name: 提交並推送更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html osh_xml_records.json
          if git diff --staged --quiet; then
            echo "無法規或新聞異動，略過 commit。"
          else
            git commit -m "auto: 定期更新 $(date -u +%Y-%m-%d)"
            git push
          fi
